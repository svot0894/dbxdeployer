# if an endpoint contains a variable, eg. {id} make sure to include the id of the object as "_id" in the JSON script
# the "_" is needed to identify what's a body parameter vs. a path parameter
# params represent query parameters
api-configs:
  jobs:
    create:
      endpoint: "/api/2.2/jobs/create"
      method: "POST"
      requires_body: true
    delete:
      endpoint: "/api/2.2/jobs/delete"
      method: "POST"
      requires_body: true
    update:
      endpoint: "/api/2.2/jobs/reset"
      method: "POST"
      requires_body: true